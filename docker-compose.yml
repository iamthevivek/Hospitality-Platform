version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hospitality_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hospitality_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d hospitality_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hospitality_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hospitality_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/hospitality_db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    ports:
      - "8080:8080"
    networks:
      - hospitality_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hospitality_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - hospitality_network

volumes:
  postgres_data:
    name: hospitality_postgres_data

networks:
  hospitality_network:
    name: hospitality_network
    driver: bridge
