server.port=8080
spring.application.name=hospitality-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hospitality_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

app.jwt.secret=${JWT_SECRET:stayease-luxury-hospitality-jwt-secret-key-must-be-256-bits-minimum!}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
